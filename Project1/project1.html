
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Steps - Pre-K Fun</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="#" class="logo"> First steps</a>
    <p>Big fun for little minds!</p>
  </header>

  <!-- Navigation -->
  <nav class="navbar" aria-label="Learning topics">
    <button class="nav-btn active" data-topic="colors">🌈 Colors</button>
    <button class="nav-btn" data-topic="animals">🐶 Animals</button>
    <button class="nav-btn" data-topic="numbers">🔢 Numbers</button>
    <button class="nav-btn" data-topic="shapes">🔷 Shapes</button>
  </nav>

  <!-- Welcome section -->
  <main>
    <section class="welcome">
      <h1>Let's Learn and Play! 🎉</h1>
      <p>Explore, discover, and have fun learning something new.</p>
    </section>

    <!-- Learning cards -->
    <section class="learning-section">
      <h2 id="topic-title">🌈 Let's Learn Colors!</h2>
      <p id="topic-description">Tap a card to discover something new.</p>

      <div class="cards" id="learning-cards"></div>
    </section>

    <!-- Quiz -->
    <section class="quiz-section">
      <h2>⭐ Let's Play a Quiz!</h2>
      <p id="quiz-question">Which one is red?</p>
      <div id="quiz-options" class="quiz-options"></div>
      <p id="quiz-feedback" aria-live="polite"></p>
      <button id="next-question" class="next-btn">
        Next Question ➜
      </button>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>💖 Keep smiling, keep learning!</p>
    <p>Made for curious little learners.</p>
  </footer>

</body>
</html>
